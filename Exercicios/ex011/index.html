<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários tamanhos de tela. Ou aumente e diminua o tamanho da janela do navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Foto grande">
    </picture>

    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML. Abaixo temos um exemplo de como fazer isso:</p>
    <audio src="media/Kuntry-Boy.mp3" autoplay controls></audio>
    <!-- MP3 WAV OGG-->

    <audio preload="metadata" autoplay controls loop>
        <source src="media/Kuntry-Boy.mp3" type="audio/mpeg">
        <source src="media/Kuntry-Boy.ogg" type="audio/ogg">
        <source src="media/Kuntry-Boy.wav" type="audio/wav">
        <p>Infelizmente seu navegador não oferece suporte à reprodução deste áudio.</p>
    </audio>

</body>
</html>
