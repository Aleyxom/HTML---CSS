<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*configurações globais*/
            height: 100%;
        }
        body {
            background-image: linear-gradient(35deg, #D94188, #BF3F9D,#7C39BF,#F2B441,#F27F3D); /*tem a op. de radial-gradient(circle, 'cores')*/
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
