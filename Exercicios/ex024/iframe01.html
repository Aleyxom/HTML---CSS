<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de IFRAME</title>
    <style>
        iframe {
            width: 300px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando um curso do 
        <iframe src="https://www.cursoemvideo.com/" scrolling="no" frameborder="0">
            <a href="https://www.cursoemvideo.com/">Curso em Vídeo</a>
        </iframe>
        para aprender programar!
    </p>

    <p>
        Outra coisa legal é o
        <iframe src="https://github.com/gustavoguanabara" frameborder="0">
            <a href="https://github.com/gustavoguanabara">GitHub</a>
        </iframe>
        do prof. Gustavo Guanabara.
    </p>
</body>
</html>
