<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela com group e scope</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 600px;
            border-collapse: collapse;
            text-align: center;
            vertical-align: middle;
        }

        th, tr.media{
            font-weight: bold;
            background-color: gray;
            color: white;
        }

        th.disciplinas{
            background-color: white;
            color: black;
        }

        th,td{
            border:1px solid black;
            padding: 10px;
        }

        td.materia{
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <!--CABEÇALHO DA TABELA ------------------------------------------------------------------------>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <!--CORPO DA TABELA ---------------------------------------------------------------------------->
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="disciplinas">Exatas</th>
                <td class="materia">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <td class="materia">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <td class="materia">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <!--MEDIA EXATAS --------------------------------------------------------------------------->
            <tr class="media">
                <th colspan="4" scope="">Média de Exatas</th>
                <td>0.0</td>
            </tr>
            <!--MEDIA EXATAS --------------------------------------------------------------------------->
            
            <tr>
                <th rowspan="2" scope="rowgroup" class="disciplinas">Humanas</th>
                <td class="materia">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <!-- MEDIA HUMANAS- ------------------------------------------------------------------------>
            <tr class="media">
                <th colspan="4" scope="row">Média de Humanas</th>
                <td>0.0</td>
            </tr>
            <!-- MEDIA HUMANAS- ------------------------------------------------------------------------>
        </tbody>

        
    </table>
</body>
</html>
